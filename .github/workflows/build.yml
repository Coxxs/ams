name: Build Atmosphère

on:
  push:
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      libnx_rev:
        description: 'libnx Git commit SHA (leave empty for pacman version)'
        required: false
        default: ''
      hactool_rev:
        description: 'hactool Git commit SHA (leave empty for pacman version)'
        required: false
        default: ''
      switch_tools_rev:
        description: 'switch-tools Git commit SHA (leave empty for pacman version)'
        required: false
        default: ''

# Default SHAs applied to all triggers (push, PR, manual).
# Set a SHA here when you need cutting-edge for a period, commit it,
# and clear it when you're done.  workflow_dispatch inputs override these.
env:
  LIBNX_REV: '7644c9b26099aa2d2145bc72a21ee24190e92085'
  HACTOOL_REV: '1d64a83450e025622f3468c28fc4164dad2c5ef6'
  SWITCH_TOOLS_REV: '22756068dd0ed6ff9734c59cb4f99ebd3f62555b'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:20260202
    steps:
      - name: Resolve dependency versions
        run: |
          # workflow_dispatch inputs override the workflow-level env defaults
          if [ -n "${{ inputs.libnx_rev }}" ]; then
            echo "LIBNX_REV=${{ inputs.libnx_rev }}" >> $GITHUB_ENV
          fi
          if [ -n "${{ inputs.hactool_rev }}" ]; then
            echo "HACTOOL_REV=${{ inputs.hactool_rev }}" >> $GITHUB_ENV
          fi
          if [ -n "${{ inputs.switch_tools_rev }}" ]; then
            echo "SWITCH_TOOLS_REV=${{ inputs.switch_tools_rev }}" >> $GITHUB_ENV
          fi

      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            gcc python3-lz4 python3-pip automake liblz4-dev zlib1g-dev
          ln -fs /usr/bin/python3 /usr/bin/python
          dkp-pacman -Syu --noconfirm
          dkp-pacman -S --noconfirm --needed \
            switch-dev switch-glm switch-libjpeg-turbo switch-tools \
            devkitARM devkitarm-rules hactool

      - name: Build hactool from source
        if: env.HACTOOL_REV != ''
        run: |
          cd /tmp
          git clone --depth 1 https://github.com/SciresM/hactool.git
          cd hactool
          git fetch --depth 1 origin $HACTOOL_REV
          git checkout $HACTOOL_REV
          cp config.mk.template config.mk
          make -j$(nproc)
          cp hactool /opt/devkitpro/tools/bin/hactool

      - name: Build switch-tools from source
        if: env.SWITCH_TOOLS_REV != ''
        run: |
          cd /tmp
          git clone --depth 1 https://github.com/switchbrew/switch-tools.git
          cd switch-tools
          git fetch --depth 1 origin $SWITCH_TOOLS_REV
          git checkout $SWITCH_TOOLS_REV
          ./autogen.sh && ./configure
          make -j$(nproc)
          make install prefix=/opt/devkitpro/tools

      - name: Build libnx from source
        if: env.LIBNX_REV != ''
        env:
          DEVKITPRO: /opt/devkitpro
        run: |
          cd /tmp
          git clone --depth 1 https://github.com/switchbrew/libnx.git
          cd libnx
          git fetch --depth 1 origin $LIBNX_REV
          git checkout $LIBNX_REV
          make -j$(nproc)
          make install DESTDIR=/opt/devkitpro/libnx

      - name: Checkout
        uses: actions/checkout@v6

      - name: Fix git ownership
        run: git config --global --add safe.directory '*'

      - name: Build
        run: make -j$(nproc)

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: atmosphere-build
          path: out/
